[project]
name = "mockrelay"
version = "0.2.0"
description = "Universal local API mock-and-record reverse proxy"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
mockrelay = "mockrelay._15:_40"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mockrelay"]
