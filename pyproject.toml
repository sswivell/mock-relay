[project]
name = "mockrelay"
dynamic = ["version"]
description = "Record real HTTP traffic. Replay it forever, offline and deterministically."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "sswivell" }]
keywords = ["http", "mock", "record", "replay", "proxy", "fixtures", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Internet :: Proxy Servers",
  "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
  "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/sswivell/mock-relay"
Documentation = "https://sswivell.github.io/mock-relay/"
Changelog = "https://github.com/sswivell/mock-relay/blob/main/CHANGELOG.md"
Issues = "https://github.com/sswivell/mock-relay/issues"
Security = "https://github.com/sswivell/mock-relay/security/advisories/new"

[project.scripts]
mockrelay = "mockrelay._15:_40"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "mockrelay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["mockrelay"]

[tool.hatch.build.targets.sdist]
include = [
  "/mockrelay",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/SECURITY.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:mockrelay.*"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["."]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM", "RUF", "S", "A", "PTH"]
ignore = [
  "E501",
  "B008",
  "RUF012",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"mockrelay/_*.py" = ["F401", "E402", "N802", "N803", "N806"]
"tests/*" = ["S101", "S105", "S106", "S311", "PTH123", "PTH118", "PTH110"]

[tool.ruff.lint.flake8-bandit]
check-typed-exception = false

[tool.mypy]
python_version = "3.10"
files = ["mockrelay"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false
disable_error_code = ["no-any-return", "misc"]

[[tool.mypy.overrides]]
module = "mockrelay._*"
ignore_errors = true

[tool.coverage.run]
source = ["mockrelay"]
branch = true
