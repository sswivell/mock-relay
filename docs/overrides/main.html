{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  <link rel="canonical" href="{{ page.canonical_url | default(config.site_url) }}">

  {# Open Graph. The image is served from the site itself so it works for
     anyone who copies the link into a chat client. #}
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MockRelay">
  <meta property="og:title" content="MockRelay — record real HTTP traffic, replay it offline">
  <meta property="og:description" content="A local HTTP proxy that records real API traffic into redacted JSON fixtures and replays them offline with ranked, deterministic matching.">
  <meta property="og:url" content="{{ config.site_url }}">
  <meta property="og:image" content="{{ config.site_url }}assets/social-preview.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MockRelay — record real HTTP traffic, replay it offline">
  <meta name="twitter:description" content="A local HTTP proxy that records real API traffic into redacted JSON fixtures and replays them offline with ranked, deterministic matching.">
  <meta name="twitter:image" content="{{ config.site_url }}assets/social-preview.png">
{% endblock %}
