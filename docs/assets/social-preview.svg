<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="MockRelay. HTTP mocking and API record/replay: record real HTTP traffic once, replay it offline as deterministic JSON fixtures.">
  <title>MockRelay - HTTP mocking and API record/replay. Record real traffic once, replay it offline.</title>

  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#d0d0d0" stroke-width="2"/>

  <g transform="translate(72,72)">
    <rect x="0" y="0" width="64" height="64" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
    <g fill="none" stroke="#1f2937" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M41 22a11 11 0 0 1 0 20"/>
      <path d="M23 42a11 11 0 0 1 0-20"/>
      <path d="M24.8 44.8 19.2 53 24.8 61.2"/>
      <path d="M39.2 20.8 44.8 29 39.2 37.2"/>
    </g>
    <circle cx="32" cy="32" r="3.6" fill="#1f2937"/>
  </g>

  <text x="164" y="122" font-family="Helvetica, Arial, sans-serif" font-size="48" font-weight="bold" fill="#1a1a1a">MockRelay</text>

  <text x="72" y="212" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#1a1a1a">HTTP mocking and API record/replay</text>
  <text x="72" y="262" font-family="Helvetica, Arial, sans-serif" font-size="38" font-weight="bold" fill="#1a1a1a">Record real traffic once. Replay it offline.</text>

  <text x="72" y="316" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#555555">A local HTTP proxy for API testing, integration tests, and CI.</text>

  <rect x="72" y="368" width="1056" height="118" fill="#f6f6f6" stroke="#d0d0d0" stroke-width="2"/>
  <text x="100" y="412" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#1a1a1a">$ mockrelay serve --mode record</text>
  <text x="100" y="452" font-family="Consolas, 'Courier New', monospace" font-size="23" fill="#1a1a1a">$ mockrelay serve --mode replay     X-MockRelay-Match: exact</text>

  <text x="72" y="540" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#555555">Ranked fixture matching &#183; secrets redacted to {{SECRET}} &#183; no network in replay</text>
  <text x="72" y="578" font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#555555">Python 3.10+ &#183; one dependency (PyYAML) &#183; MIT</text>
</svg>
