<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="640" role="img" aria-label="MockRelay — record real HTTP traffic once, replay it locally whenever you want.">
  <title>MockRelay — record real HTTP traffic once, replay it locally whenever you want.</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#080c14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="170" cy="120" rx="420" ry="300" fill="url(#glowA)"/>
  <ellipse cx="1060" cy="560" rx="440" ry="300" fill="url(#glowB)"/>

  <g transform="translate(64,52)">
    <rect x="0" y="0" width="56" height="56" rx="15" fill="#0b0f19" stroke="url(#brand)" stroke-width="2"/>
    <path d="M39 20a11 11 0 0 1 0 16" fill="none" stroke="url(#brand)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M17 36a11 11 0 0 1 0-16" fill="none" stroke="url(#brand)" stroke-width="3.4" stroke-linecap="round"/>
    <path d="M18.6 38.4 13.6 45.2 18.6 52" fill="none" stroke="url(#brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M37.4 20 42.4 26.8 37.4 33.6" fill="none" stroke="url(#brand)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="28" r="4.4" fill="url(#brand)"/>
  </g>

  <text x="140" y="98" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#brand)" letter-spacing="-1.2">MockRelay</text>

  <text x="64" y="206" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="43" font-weight="700" fill="#f8fafc" letter-spacing="-0.8">Record real HTTP traffic once.</text>
  <text x="64" y="260" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="43" font-weight="700" fill="#f8fafc" letter-spacing="-0.8">Replay it locally whenever you want.</text>

  <text x="64" y="308" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="500" fill="#94a3b8">A local HTTP proxy with ranked fixture matching, redaction, and a CI-friendly CLI.</text>

  <g transform="translate(64,352)">
    <rect width="520" height="104" rx="12" fill="#0b1220" stroke="#243044" stroke-width="1.5"/>
    <text x="26" y="42" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#38bdf8">$ mockrelay serve --mode record</text>
    <text x="26" y="78" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="17" fill="#7c8ba1">saved fixtures/gh/gh-get-016c60e26e39.json</text>
  </g>

  <g transform="translate(616,352)">
    <rect width="520" height="104" rx="12" fill="#0b1220" stroke="#243044" stroke-width="1.5"/>
    <text x="26" y="42" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="700" fill="#34d399">$ mockrelay serve --mode replay</text>
    <text x="26" y="78" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="17" fill="#7c8ba1">X-MockRelay-Score: 4000009</text>
  </g>

  <g transform="translate(64,500)">
    <rect width="470" height="62" rx="10" fill="#111c2e" stroke="#2b3a52" stroke-width="1.5"/>
    <text x="26" y="40" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="21" font-weight="700" fill="#e2e8f0">$ pip install mockrelay</text>
  </g>
  <text x="560" y="540" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#64748b">MIT licensed &#183; Python 3.10+</text>
</svg>
