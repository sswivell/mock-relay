site_name: MockRelay
site_description: >-
  Record real HTTP traffic once, replay it offline and deterministically.
  A local HTTP proxy with ranked fixture matching, redaction, and a CI-friendly
  CLI.
site_author: sswivell
site_url: https://sswivell.github.io/mock-relay/
repo_url: https://github.com/sswivell/mock-relay
repo_name: sswivell/mock-relay
edit_uri: edit/main/docs/
copyright: Copyright &copy; sswivell - MIT licensed

theme:
  # The theme that ships with MkDocs. White page, plain text sidebar, nothing
  # clever. `nav_style: light` keeps the top bar white, and `color_mode: light`
  # drops the dark-mode toggle so there is only ever one appearance.
  name: mkdocs
  nav_style: light
  color_mode: light
  # Only used for the <head> meta tags in overrides/main.html: the canonical
  # URL and the Open Graph / Twitter card, so a shared link renders a preview.
  custom_dir: docs/overrides
  favicon: assets/logo.svg

extra:
  generator: false

# The extensions the pages actually use: fenced code, tables, definition lists,
# footnotes, and the `!!!` / `???` admonition blocks.
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Core Concepts:
      - Operating Modes: modes.md
      - Smart Matching: matching.md
      - Fixtures & Redaction: fixtures.md
  - Reference:
      - CLI Reference: cli.md
      - Configuration: configuration.md
      - Admin API & UI: admin.md
      - Architecture: architecture.md
  - Guides:
      - Common Recipes: recipes.md
      - Demo Script: demo.md
      - Development: development.md
